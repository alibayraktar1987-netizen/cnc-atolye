name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  validate-static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Main application regression checks
        run: node scripts/check-main.cjs

      - name: Report and collection calculations
        run: node --test scripts/check-reporting.cjs

      - name: Measurement and warehouse regressions
        run: node --test scripts/check-workshop.cjs

      - name: FAI dimension detection regressions
        run: node --test scripts/check-fai.cjs scripts/check-fai-iso.cjs

      - name: Quality record deletion regressions
        run: node --test scripts/check-quality-records.cjs

      - name: Validate required files
        run: |
          test -f index.html
          test -f orders.html
          test -f openapi.yaml
          test -f README.md
          test -f docs/requirements.md

      - name: Check unresolved conflict markers
        run: |
          if grep -R --line-number -E "^(<<<<<<<|=======|>>>>>>>)" index.html orders.html js css docs openapi.yaml; then
            echo "Conflict marker found"
            exit 1
          fi

      - name: Validate OpenAPI syntax
        run: |
          python -m pip install --quiet openapi-spec-validator
          python -m openapi_spec_validator openapi.yaml

  estimator-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cost-estimator/frontend/package-lock.json
      - run: npm ci
        working-directory: cost-estimator/frontend
      - run: npm run build
        working-directory: cost-estimator/frontend

  estimator-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r cost-estimator/backend/requirements.txt
      - run: python -m unittest discover -s cost-estimator/backend/tests -v
